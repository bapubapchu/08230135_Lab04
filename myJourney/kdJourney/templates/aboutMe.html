{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>About Me</title>
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
</head>
<style>
  /* Centered circular profile picture with hover effect */
  .profile-pic {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 30px 0;
  }

  .profile-pic img {
    width: 220px; /* Larger size */
    height: 220px; /* Larger size */
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #fff; /* Slightly thicker border for proportion */
    box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: block;
  }

  /* Hover effect — zoom in slightly and add a glow */
  .profile-pic img:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), 0 0 14px rgba(255, 255, 255, 0.5);
  }
</style>


<body>
    <h1>About Me</h1>
    <div class="profile-pic">
        <img src="{% static 'images/dema.jpg' %}" alt="Profile Picture">
    </div>
    {% if about_infos %}
        {% for info in about_infos %}
            <div class="about-section">
                <p> {{ info.bio }}</p>
            </div>
        {% endfor %}
    {% else %}
        <p>No information available.</p>
    {% endif %}
    <a href="{% url 'index' %}">Back to Learning Journey</a>

    <div class="index-image">
      <img src="{% static 'images/4.PNG' %}" alt="Description of Image">
    </div>
</body>
</html>
